<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CodeAlpha FAQ Chatbot</title>
  <desc id="desc">A dark teal animated banner showing a question flowing through NLP and TF-IDF matching into an answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092f35"/>
      <stop offset="0.55" stop-color="#0d4a4c"/>
      <stop offset="1" stop-color="#e2734e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#123f43" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0b3035" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#03191d" flood-opacity="0.35"/>
    </filter>
    <style>
      .label { font: 600 18px 'Segoe UI', sans-serif; letter-spacing: 2px; fill: #8dd8c9; }
      .title { font: 700 64px Georgia, serif; fill: #fffaf0; }
      .copy { font: 400 24px 'Segoe UI', sans-serif; fill: #d6ece4; }
      .node-title { font: 700 20px 'Segoe UI', sans-serif; fill: #fffaf0; }
      .node-copy { font: 400 16px 'Segoe UI', sans-serif; fill: #b8d9d1; }
      .flow { stroke: #f1b36b; stroke-width: 3; stroke-dasharray: 10 12; animation: dash 3s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </defs>
  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="180" fill="#f3a35d" opacity=".13"/>
  <circle cx="110" cy="570" r="210" fill="#72c9b6" opacity=".10"/>
  <path d="M0 470 C350 360 580 610 930 475 S1350 380 1600 450 V620 H0Z" fill="#05282e" opacity=".34"/>

  <g transform="translate(92 86)">
    <text class="label" x="0" y="0">CODEALPHA / TASK 2</text>
    <text class="title" x="0" y="86">FAQ Chatbot</text>
    <text class="copy" x="0" y="137">Explainable support powered by NLP, TF-IDF, and cosine similarity.</text>
    <g transform="translate(0 205)" class="float">
      <rect width="560" height="98" rx="18" fill="url(#panel)" stroke="#80d4c3" stroke-opacity=".35" filter="url(#shadow)"/>
      <circle cx="42" cy="49" r="24" fill="#f1b36b"/>
      <text x="42" y="58" text-anchor="middle" font-size="27" font-family="Georgia" font-weight="700" fill="#123f43">?</text>
      <text class="node-title" x="82" y="43">Ask a question</text>
      <text class="node-copy" x="82" y="70">“How do I reset my password?”</text>
    </g>
  </g>

  <g transform="translate(730 116)">
    <line class="flow" x1="-72" y1="217" x2="30" y2="217"/>
    <line class="flow" x1="300" y1="217" x2="400" y2="217"/>
    <g class="pulse">
      <rect width="300" height="230" rx="22" fill="url(#panel)" stroke="#80d4c3" stroke-opacity=".45" filter="url(#shadow)"/>
      <text class="label" x="28" y="44">MATCHING ENGINE</text>
      <text class="node-title" x="28" y="90">Normalize - vectorize</text>
      <text class="node-copy" x="28" y="128">NLTK preprocessing</text>
      <text class="node-copy" x="28" y="155">TF-IDF matrix</text>
      <text class="node-copy" x="28" y="182">Cosine score >= 0.35</text>
      <circle cx="252" cy="178" r="18" fill="none" stroke="#f1b36b" stroke-width="4"/>
      <path d="M265 191 l14 14" stroke="#f1b36b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(400 0)" class="float">
      <rect width="320" height="230" rx="22" fill="#fffaf0" filter="url(#shadow)"/>
      <text class="label" x="28" y="44" fill="#28766e">RESPONSE</text>
      <text x="28" y="93" font-size="22" font-family="Segoe UI, sans-serif" font-weight="700" fill="#123f43">Matched FAQ answer</text>
      <text x="28" y="132" font-size="17" font-family="Segoe UI, sans-serif" fill="#3f6865">Fast, structured,</text>
      <text x="28" y="158" font-size="17" font-family="Segoe UI, sans-serif" fill="#3f6865">and safely rendered.</text>
      <rect x="28" y="181" width="112" height="26" rx="13" fill="#d8efe8"/>
      <text x="84" y="199" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" font-weight="700" fill="#28766e">CATEGORY: ACCOUNT</text>
    </g>
  </g>
</svg>
